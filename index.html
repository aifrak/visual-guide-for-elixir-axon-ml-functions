<!DOCTYPE html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elixir Axon ML Functions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://unpkg.com/mermaid@11.12.2/dist/mermaid.min.js"></script>
  </head>
  <body class="bg-base-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      mermaid.initialize({
        startOnLoad: true,
        theme: "dark",
        themeVariables: { darkMode: true },
      });

      // Main App component
      const App = () => {
        return (
          <div className="bg-base-100 min-h-screen">
            <div className="max-w-4xl mx-auto flex flex-col gap-2">
              <h1 className="text-3xl font-bold mb-8 text-center">
                Elixir Axon ML Functions
              </h1>
              <div className="flex flex-col gap-4 p-2">
                <p>
                  Visual guide to Elixir Axon activation and loss functions.
                  (Graphs, descriptions and use cases vibe-coded)
                </p>
                <a
                  href="https://github.com/aifrak/visual-guide-for-elixir-axon-ml-functions"
                  target="_blank"
                >
                  <svg class="size-8" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path>
                  </svg>
                </a>
              </div>
              <div role="tablist" class="tabs tabs-box">
                <ActivationFunctionsTab
                  functionConfigs={functionConfigs.activation}
                />
                <LossFunctionsTab functionConfigs={functionConfigs.loss} />
              </div>
            </div>

            <ScrollToTop />
          </div>
        );
      };

      const ActivationFunctionsTab = ({ functionConfigs }) => {
        const closeMenu = (e) => {
          e.target.closest("details").removeAttribute("open");
        };

        return (
          <Tab
            name="function-graphs"
            title="Activation Functions"
            className="flex flex-col gap-2"
            checked={true}
          >
            <ul class="menu sm:menu-horizontal bg-base-200 rounded-box">
              <li>
                {" "}
                <a href="#what-are-activation-functions">
                  What are Activation Functions?
                </a>{" "}
              </li>
              <li>
                {" "}
                <a href="#activations-key-concepts">Key Concepts</a>{" "}
              </li>
              <li>
                {" "}
                <a href="#activations-beginner-decision-tree">
                  Beginner's Decision Tree
                </a>{" "}
              </li>
              <li>
                <details class="w-64 z-10">
                  <summary>Functions</summary>
                  <ul>
                    {functionConfigs.map((funcConfig) => (
                      <li>
                        {" "}
                        <a href={`#${funcConfig.id}`} onClick={closeMenu}>
                          {funcConfig.name}
                        </a>{" "}
                      </li>
                    ))}
                  </ul>
                </details>
              </li>
            </ul>

            <div class="flex flex-col gap-2">
              <Section
                id="what-are-activation-functions"
                title="What are Activation Functions?"
              >
                <SubSection className="flex flex-col gap-6">
                  <p>
                    Activation functions are mathematical operations applied to
                    each neuron's output in a neural network. They introduce{" "}
                    <strong className="text-warning"> non-linearity </strong>,
                    which allows the network to learn complex patterns. Without
                    activation functions, your neural network would just be a
                    fancy linear regression model, no matter how many layers you
                    add!
                  </p>
                  <p>
                    Think of them as decision-makers: they take the neuron's
                    input and decide how strongly to "fire" or activate.
                    Different activation functions have different properties -
                    some are fast, some are smooth, some prevent certain
                    training problems.
                  </p>
                  <p>
                    <strong>Links:</strong>
                    <ul>
                      <li>
                        <a
                          class="link link-primary"
                          href="https://en.wikipedia.org/wiki/Activation_function"
                        >
                          Wikipedia page
                        </a>
                      </li>
                      <li>
                        <a
                          class="link link-primary"
                          href="https://en.wikipedia.org/wiki/Activation_function#Table_of_activation_functions"
                        >
                          Wikipedia - Table of activation functions
                        </a>
                      </li>
                    </ul>
                  </p>
                </SubSection>
              </Section>

              <Section id="activations-key-concepts" title="Key Concepts">
                <SubSection className="flex flex-col gap-6">
                  <div>
                    <strong className="text-info">
                      {" "}
                      Graphable Functions:{" "}
                    </strong>
                    Only activation functions can be visualized as mathematical
                    graphs. They transform input values element-wise.
                  </div>
                  <div>
                    <strong className="text-success">
                      {" "}
                      Modern Activations:{" "}
                    </strong>
                    GELU, SiLU, and Mish are popular in recent architectures
                    like transformers and perform well across tasks.
                  </div>
                  <div>
                    <strong className="text-warning">
                      {" "}
                      Hardware-Friendly:{" "}
                    </strong>
                    Hard sigmoid, hard tanh, and ReLU6 are optimized for mobile
                    and edge devices with limited compute.
                  </div>
                  <div>
                    <strong className="text-error">
                      {" "}
                      Non-Graphable Layers:{" "}
                    </strong>
                    Linear (dense, embedding), Convolution, Pooling,
                    Normalization, Recurrent, and Shape layers operate on
                    tensors and cannot be shown as simple 2D graphs.
                  </div>
                </SubSection>
              </Section>

              <Section
                id="activations-beginner-decision-tree"
                title="Beginner's Decision Tree"
              >
                <SubSection>
                  <Mermaid chart={activationFunctionsDecisionTree} />
                </SubSection>
              </Section>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1">
                {functionConfigs.map((funcConfig) => (
                  <FunctionGraph funcConfig={funcConfig} />
                ))}
              </div>
            </div>
          </Tab>
        );
      };

      const LossFunctionsTab = ({ functionConfigs }) => {
        const closeMenu = (e) => {
          e.target.closest("details").removeAttribute("open");
        };

        return (
          <Tab
            name="function-graphs"
            title="Loss Functions"
            className="flex flex-col gap-2"
          >
            <ul class="menu sm:menu-horizontal bg-base-200 rounded-box">
              <li>
                {" "}
                <a href="#what-are-loss">What are Loss Functions?</a>{" "}
              </li>
              <li>
                {" "}
                <a href="#loss-key-concepts">Key Concepts</a>{" "}
              </li>
              <li>
                <details class="w-64 z-10">
                  <summary>Functions</summary>
                  <ul>
                    {functionConfigs.map((funcConfig) => (
                      <li>
                        {" "}
                        <a href={`#${funcConfig.id}`} onClick={closeMenu}>
                          {funcConfig.name}
                        </a>{" "}
                      </li>
                    ))}
                  </ul>
                </details>
              </li>
            </ul>

            <div class="flex flex-col gap-2">
              <Section id="what-are-loss" title="What are Loss Functions?">
                <SubSection className="flex flex-col">
                  <p className="leading-relaxed mb-3">
                    Loss functions (also called cost or objective functions)
                    measure <strong className="text-warning">how wrong</strong>{" "}
                    your model's predictions are. During training, the network
                    tries to <strong className="text-success">minimize</strong>{" "}
                    this loss - making smaller and smaller errors over time.
                  </p>
                  <p className="leading-relaxed">
                    The choice of loss function depends on your task: regression
                    tasks (predicting numbers) use different losses than
                    classification tasks (predicting categories). The loss
                    function is what the training algorithm optimizes - it's the
                    "compass" that guides learning.
                  </p>
                  <p>
                    <strong>Links:</strong>
                    <ul>
                      <li>
                        <a
                          class="link link-primary"
                          href="https://en.wikipedia.org/wiki/Loss_function"
                        >
                          Wikipedia page
                        </a>
                      </li>
                    </ul>
                  </p>
                </SubSection>
              </Section>

              <Section id="loss-key-concepts" title="Key Concepts">
                <SubSection className="flex flex-col gap-4">
                  <div>
                    <strong className="text-info"> MSE vs MAE: </strong>
                    MSE penalizes large errors more heavily. MAE treats all
                    errors equally.
                  </div>
                  <div>
                    <strong className="text-success"> Huber Loss: </strong>
                    Combines benefits of MSE and MAE, quadratic for small
                    errors, linear for large ones.
                  </div>
                  <div>
                    <strong className="text-warning"> Cross-Entropy: </strong>
                    Standard loss for classification tasks. Measures difference
                    between predicted and true distributions.
                  </div>
                  <div>
                    <strong className="text-error"> Task Specific: </strong>
                    Use MSE/MAE for regression, cross-entropy for
                    classification.
                  </div>
                </SubSection>
              </Section>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1">
                {functionConfigs.map((funcConfig) => (
                  <FunctionGraph
                    key={funcConfig.name}
                    funcConfig={funcConfig}
                  />
                ))}
              </div>
            </div>
          </Tab>
        );
      };

      const Tab = ({ name, title, className, checked = false, children }) => {
        const [isActive, setIsActive] = useState(checked);

        return (
          <>
            <input
              type="radio"
              name={name}
              class="tab"
              aria-label={title}
              defaultChecked={checked}
              onChange={(e) => setIsActive(e.target.checked)}
            />

            <div class="tab-content">{isActive && children}</div>
          </>
        );
      };

      const Section = ({ id = "", title, children }) => {
        return (
          <section
            id={id ? id : ""}
            className="card card-border bg-base-100 full-w"
          >
            <div class="card-body justify-between">
              <h2 class="card-title text-2xl font-semibold mb-4"> {title} </h2>
              {children}
            </div>
          </section>
        );
      };
      const SubSection = ({ className, children }) => {
        return (
          <section class="card flex flex-col gap-6 bg-base-200 shadow-xl leading-relaxed">
            <div class={`card-body ${className}`}>{children}</div>
          </section>
        );
      };

      // Graph component
      const FunctionGraph = ({ funcConfig }) => {
        const chartRef = useRef(null);

        useEffect(() => {
          if (chartRef.current) {
            vegaEmbed(chartRef.current, createSpec(funcConfig), {
              actions: false,
            });
          }
        }, [funcConfig]);

        const links = [
          funcConfig.pytorch && (
            <a
              className="link link-primary"
              href={funcConfig.pytorch}
              target="_blank"
            >
              🔥 PyTorch
            </a>
          ),
          funcConfig.wiki && (
            <a
              className="link link-primary"
              href={funcConfig.wiki}
              target="_blank"
            >
              📖 Wikipedia
            </a>
          ),
          funcConfig.mlCheatsheet && (
            <a
              className="link link-primary"
              href={funcConfig.mlCheatsheet}
              target="_blank"
            >
              📕 ML Cheatsheet
            </a>
          ),
        ].filter(Boolean);

        return (
          <Section id={funcConfig.id} title={funcConfig.name}>
            <SubSection className="flex flex-col gap-4">
              <div class="flex flex-col gap-2">
                <a class="link link-primary" href={funcConfig.axon.docLink}>
                  <code>{funcConfig.axon.functionName}</code>
                </a>
              </div>
              <div class="">
                <div class="font-semibold">Description:</div>
                <p>{funcConfig.description}</p>
              </div>
              <div class="">
                <div class="font-semibold">Use Cases:</div>
                <ul class="text-success text-sm flex flex-col gap-1">
                  {funcConfig.useCases.map((useCase) => (
                    <li class="font-semibold">✓ {useCase}</li>
                  ))}
                </ul>
              </div>
              <div>
                {links.map((link, index) => (
                  <>
                    {index > 0 && <span> | </span>}
                    {link}
                  </>
                ))}
              </div>
            </SubSection>
            <div
              ref={chartRef}
              class="card bg-base-100 shadow-xl mx-auto w-full h-64 overflow-hidden"
            ></div>
          </Section>
        );
      };

      const Mermaid = ({ chart }) => {
        const mermaidRef = useRef(null);
        const [zoom, setZoom] = useState(1);

        useEffect(() => {
          if (mermaidRef.current) {
            mermaid.contentLoaded();
            mermaid.init(undefined, mermaidRef.current);
          }
        }, [chart]);

        return (
          <div className="flex flex-col gap-2">
            <div
              className="overflow-auto border border-slate-600 rounded-lg p-4 bg-slate-900"
              style={{ maxHeight: "600px" }}
            >
              <div
                style={{
                  transform: `scale(${zoom})`,
                  transformOrigin: "top left",
                }}
              >
                <pre className="mermaid" ref={mermaidRef}>
                  {chart}
                </pre>
              </div>
            </div>
            <div className="flex gap-2 justify-center">
              <button
                onClick={() => setZoom((z) => Math.min(z + 0.2, 10))}
                className="btn btn-soft btn-primary btn-circle"
              >
                {magnifyingGlassPlusIcon()}
              </button>
              <button
                onClick={() => setZoom((z) => Math.max(z - 0.2, 0.5))}
                className="btn btn-soft btn-primary btn-circle"
              >
                {magnifyingGlassMinusIcon()}
              </button>
              <button
                onClick={() => setZoom(1)}
                className="btn btn-soft btn-primary"
              >
                Reset
              </button>
            </div>
          </div>
        );
      };

      const ScrollToTop = () => {
        const [isVisible, setIsVisible] = useState(false);

        useEffect(() => {
          const toggleVisibility = () => {
            setIsVisible(window.scrollY > 300);
          };

          window.addEventListener("scroll", toggleVisibility);
          return () => window.removeEventListener("scroll", toggleVisibility);
        }, []);

        const scrollToTop = () => {
          window.scrollTo({ top: 0 });
        };

        return (
          <>
            {isVisible && (
              <button
                onClick={scrollToTop}
                className="fab"
                aria-label="Scroll to top"
              >
                <div class="btn btn-lg btn-circle btn-secondary">{arrowUpIcon()}</div>
              </button>
            )}
          </>
        );
      };

      // Icons
      const arrowUpIcon = () => {
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            strokeWidth={1.5}
            stroke="currentColor"
            className="size-6"
          >
            <path
              strokeLinecap="round"
              strokeLinejoin="round"
              d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18"
            />
          </svg>
        );
      };

      const magnifyingGlassPlusIcon = () => {
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            strokeWidth={1.5}
            stroke="currentColor"
            className="size-6"
          >
            <path
              strokeLinecap="round"
              strokeLinejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607ZM10.5 7.5v6m3-3h-6"
            />
          </svg>
        );
      };

      const magnifyingGlassMinusIcon = () => {
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607ZM13.5 10.5h-6"
            />
          </svg>
        );
      };

      // Activation Functions
      const sigmoid = (x) => 1 / (1 + Math.exp(-x));
      const tanh = (x) => Math.tanh(x);
      const relu = (x) => Math.max(0, x);
      const leakyRelu = (x) => (x > 0 ? x : 0.01 * x);
      const elu = (x) => (x > 0 ? x : 1.0 * (Math.exp(x) - 1));
      const softplus = (x) => Math.log(1 + Math.exp(x));
      const gelu = (x) =>
        0.5 *
        x *
        (1 +
          Math.tanh(Math.sqrt(2 / Math.PI) * (x + 0.044715 * Math.pow(x, 3))));
      const hardSigmoid = (x) => Math.max(0, Math.min(1, 0.2 * x + 0.5));
      const hardTanh = (x) => Math.max(-1, Math.min(1, x));
      const selu = (x) => {
        const alpha = 1.67326;
        const scale = 1.0507;
        return scale * (x > 0 ? x : alpha * (Math.exp(x) - 1));
      };
      const silu = (x) => x * sigmoid(x);
      const mish = (x) => x * Math.tanh(softplus(x));
      const relu6 = (x) => Math.min(Math.max(0, x), 6);
      const celu = (x) => (x > 0 ? x : 1.0 * (Math.exp(x) - 1));
      const logSigmoid = (x) => Math.log(sigmoid(x));
      const softsign = (x) => x / (1 + Math.abs(x));
      const logSumExp = (x) => Math.log(Math.exp(x) + Math.exp(-x)); // simplified for single value
      const softmax = (x) => Math.exp(x) / (Math.exp(x) + Math.exp(0)); // simplified for visualization
      const logSoftmax = (x) => x - Math.log(Math.exp(x) + Math.exp(0)); // simplified

      // Loss Functions (simplified for visualization)
      const bce = (x) => {
        const p = 1 / (1 + Math.exp(-x));
        return -Math.log(Math.max(p, 0.0001));
      };
      const cce = (x) =>
        -Math.log(Math.max(Math.exp(x) / (Math.exp(x) + Math.exp(0)), 0.0001));
      const mse = (x) => x * x;
      const mae = (x) => Math.abs(x);
      const huber = (x) => (Math.abs(x) <= 1 ? 0.5 * x * x : Math.abs(x) - 0.5);
      const kld = (x) => {
        const p = Math.exp(x) / (Math.exp(x) + Math.exp(0));
        const q = 0.5;
        return p * Math.log(Math.max(p / q, 0.0001));
      };
      const hinge = (x) => Math.max(0, 1 - x);
      const categoricalHinge = (x) => Math.max(0, x);
      const cosineSimilarity = (x) => 1 - x / Math.sqrt(1 + x * x);
      const logCosh = (x) => Math.log(Math.cosh(x));
      const poissonLoss = (x) => Math.exp(x) - x;
      const softMarginLoss = (x) => Math.log(1 + Math.exp(-x));

      // Generate data points for a function
      const generateData = (func) => {
        const data = [];
        for (let x = -6; x <= 6; x += 0.1) {
          data.push({ x: x, y: func(x) });
        }
        return data;
      };

      const functionConfigs = {
        activation: [
          {
            id: "sigmoid",
            name: "Sigmoid",
            func: sigmoid,
            color: "#3b82f6",
            axon: {
              functionName: "Axon.sigmoid/2",
              docLink: "https://hexdocs.pm/axon/Axon.html#sigmoid/2",
            },
            description:
              "Axon.sigmoid/2 - Maps values to (0,1). Used in binary classification.",
            useCases: [
              "Binary classification output (yes/no, true/false)",
              "When you need probabilities between 0 and 1",
            ],
            wiki: "https://en.wikipedia.org/wiki/Sigmoid_function",
            pytorch:
              "https://docs.pytorch.org/docs/stable/generated/torch.nn.modules.activation.Sigmoid.html",
            mlCheatsheet:
              "https://ml-cheatsheet.readthedocs.io/en/latest/activation_functions.html#sigmoid",
          },
          {
            id: "tanh",
            name: "Tanh",
            func: tanh,
            color: "#10b981",
            axon: {
              functionName: "Axon.tanh/2",
              docLink: "https://hexdocs.pm/axon/Axon.html#tanh/2",
            },
            description: "Maps values to (-1,1). Better for hidden layers.",
            useCases: [
              "Hidden layers in shallow networks",
              "When you need outputs centered around 0",
              "Recurrent networks (RNNs)",
            ],
            wiki: "https://en.wikipedia.org/wiki/Hyperbolic_functions#Hyperbolic_tangent",
            pytorch:
              "https://docs.pytorch.org/docs/stable/generated/torch.nn.modules.activation.Tanh.html",
            mlCheatsheet:
              "https://ml-cheatsheet.readthedocs.io/en/latest/activation_functions.html#tanh",
          },
          {
            id: "hard-sigmoid",
            name: "Hard Sigmoid",
            func: hardSigmoid,
            color: "#14b8a6",
            axon: {
              functionName: "Axon.hard_sigmoid/2",
              docLink: "https://hexdocs.pm/axon/Axon.html#hard_sigmoid/2",
            },
            description: "Piecewise linear approximation of sigmoid.",
            useCases: [
              "MOBILE and EDGE devices (faster computation)",
              "Quantized neural networks",
              "Real-time applications",
            ],
            wiki: "https://en.wikipedia.org/wiki/Hard_sigmoid",
            pytorch:
              "https://docs.pytorch.org/docs/stable/generated/torch.nn.modules.activation.Hardsigmoid.html",
            mlCheatsheet: null,
          },
          {
            id: "hard-tanh",
            name: "Hard Tanh",
            func: hardTanh,
            color: "#fb923c",
            axon: {
              functionName: "Axon.hard_tanh/2",
              docLink: "https://hexdocs.pm/axon/Axon.html#hard_tanh/2",
            },
            description: "Clipped linear function in [-1, 1].",
            useCases: [
              "Mobile and embedded systems",
              "Hardware with limited compute",
              "Fast approximation of tanh",
            ],
            wiki: null,
            pytorch:
              "https://docs.pytorch.org/docs/stable/generated/torch.nn.modules.activation.Hardtanh.html",
            mlCheatsheet: null,
          },
          {
            id: "relu",
            name: "ReLU (Rectified Linear Unit)",
            func: relu,

      // Create Vega-Lite spec for a function
      const createSpec = (funcConfig) => ({
        $schema: "https://vega.github.io/schema/vega-lite/v5.json",
        width: "container",
        height: "container",
        data: { values: generateData(funcConfig.func) },
        layer: [
          {
            mark: { type: "rule", strokeDash: [4, 4], color: "#9ca3af" },
            encoding: { y: { datum: 0 } },
          },
          {
            mark: { type: "rule", strokeDash: [4, 4], color: "#9ca3af" },

          {

              color: funcConfig.color,
              strokeWidth: 3,
            },
            encoding: {

                field: "x",
                type: "quantitative",
                title: "Input",

                title: "Output",

              },
            },
          },
        ],
